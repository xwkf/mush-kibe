play:
  games:
    - skywars
    - bedwars

protection:
  void-level: 0

arrival:
  fly-height: 5

launch-pad:
  enabled: true
  block: SLIME_BLOCK
  distance: 20
  height: 5
  cooldown: 1s
  sound:
    sound: FIREWORK_LAUNCH
    volume: 1.0
    pitch: 1.0
  particles:
    interval: 250ms
    per-block: 1
    view-radius: 32

afk:
  enabled: true
  idle-after: 5m
  server-group: afk
  check-interval: 1s
  origin-ttl: 12h

bossbar:
  interval: 500ms
  frames:
    - "&e&lMUXE"
    - "&6&lMUXE"

scoreboard:
  title: "&b&lMUXE"
  update-interval: 1s
  default-tag: "&7Membro"
  default-credits: 0
  lines:
    - ""
    - "&fTag: {tag}"
    - "&fCréditos: &d{credits}"
    - ""
    - "&fLobby: &a#{lobby}"
    - "&fJogadores: &b{players}"
    - ""
    - "&amuxe.com.br"

messages:
  play-usage: "&eUso: /jogar <modo>. Modos: &f{games}"
  play-unknown: "&cModo desconhecido. Modos: &f{games}"
  play-failed: "&cNão foi possível entrar agora. Tente novamente."
  spawn-set: "&aSpawn do lobby definido."
  fly-enabled: "&eVocê ativou o &bmodo voar&e!"
  fly-disabled: "&cVocê desativou o modo voar!"
